---
# infra/ansible/roles/hardening/tasks/main.yml
# Base hardening, applied to ALL nodes (control-plane + workers):
#   - create a non-root sudo user with SSH-key-only access
#   - disable root SSH login and password authentication
#   - enable ufw, allowing only SSH (22) + k8s/Traefik ports as needed
#
# Idempotent by construction: every task below is a declarative Ansible
# module (not a raw shell command), so re-running reports changed=0 once
# converged.

- name: Ensure non-root admin user exists
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    state: present

- name: Allow admin_user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"

- name: Install admin_user's SSH public key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    state: present
    key: "{{ lookup('file', ssh_public_key_path) }}"

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: restart sshd

- name: Disable SSH password authentication (keys only)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: restart sshd

- name: Flush handlers to apply SSH settings immediately
  ansible.builtin.meta: flush_handlers

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow SSH through ufw
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP/HTTPS through ufw (Traefik ingress)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: Allow internal cluster traffic through ufw (k8s API, kubelet, flannel)
  community.general.ufw:
    rule: allow
    src: "{{ cluster_private_cidr }}"
  # Defense-in-depth only: the AWS Security Group already blocks 6443/
  # node-ports from the internet. ufw here just means a second layer
  # agrees, restricted to the VPC's private CIDR.

- name: Set ufw default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set ufw default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Explicitly allow incoming K3s API server control traffic from internal hosts
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp

- name: Allow pod CIDR traffic through ufw (flannel overlay)
  community.general.ufw:
    rule: allow
    src: "{{ pod_cidr }}"
  become: true

- name: Enable ufw
  community.general.ufw:
    state: enabled
    logging: "on"

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when: enable_fail2ban | default(true)

- name: Ensure fail2ban is running and enabled
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  when: enable_fail2ban | default(true)
