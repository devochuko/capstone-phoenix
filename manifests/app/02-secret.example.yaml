# manifests/app/02-secret.example.yaml
#
# TEMPLATE ONLY — committed safely because .gitignore explicitly allows
# `*secret*.example.yaml` (see .gitignore). Contains placeholder values,
# never real credentials.
#
# The REAL Secret is created out-of-band, directly against the cluster,
# and is NEVER written to a file that could accidentally be committed.
# The `Prune=false` annotation is REQUIRED — without it, Argo CD's
# automated prune (enabled in gitops/app/application.yaml) will delete
# this Secret on the next sync, since it has no matching manifest in git
# to protect it the way ignoreDifferences would for a git-tracked
# resource. See gitops/app/application.yaml's comments for the full
# explanation of why ignoreDifferences alone is NOT sufficient here.
#
#   kubectl create secret generic taskapp-secret \
#     --namespace taskapp \
#     --from-literal=POSTGRES_USER='taskapp' \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=SECRET_KEY="$(openssl rand -base64 32)"
#
#   kubectl annotate secret taskapp-secret -n taskapp \
#     argocd.argoproj.io/sync-options=Prune=false
#
# This satisfies "GitOps owns the cluster" without requiring secrets to
# live in plaintext in the repo. See docs/ARCHITECTURE.md "Secrets
# approach" for the full rationale, including why we chose out-of-band
# over Sealed Secrets / External Secrets (stretch goal, not implemented
# here — see docs/ARCHITECTURE.md for the trade-off).

apiVersion: v1
kind: Secret
metadata:
  name: taskapp-secret
  namespace: taskapp
type: Opaque
stringData:
  POSTGRES_USER: "CHANGEME"
  POSTGRES_PASSWORD: "CHANGEME"
  SECRET_KEY: "CHANGEME"
